<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pierre Feuille Ciseau</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <h1>Pierre Feuille Ciseau</h1>
    <p> Veuillez choisir entre Pierre, Feuille ou Ciseau.</p>

    <div id="choixUtilisateur">
        <button class="choix" id="pierre"> Pierre </button>
        <button class="choix" id="feuille"> Feuille </button>
        <button class="choix" id="ciseau"> Ciseau </button>
    </div>

    <div id="resultat"></div>

    <div id="score">
        <p> Choix du joueur : <span id="affichageChoixJoueur"></span></p>
        <p> Choix de l'ordinateur : <span id="affichageChoixOrdinateur"></span></p>
    </div>

    <div id="reset">
        <button id="reset"> Recommencer </button>
    
    <script src="../js/script.js"></script>
</body>
</html>
